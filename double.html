<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phigros 双押整齐度检测器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #0a0a0f;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(20, 20, 30, 0.8);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 30px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #7a7a8c;
      font-size: 0.9rem;
      margin-top: -15px;
      letter-spacing: 1px;
    }

    /* 双押按键区域 */
    .dual-zone {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      width: 100%;
      flex-wrap: wrap;
    }

    .key-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a2a3c, #14141e);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), inset 0 -5px 10px rgba(0, 0, 0, 0.8), inset 0 5px 10px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.08s ease;
      border: 2px solid rgba(255, 255, 255, 0.15);
      color: #ccc;
      font-weight: bold;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .key-btn:active {
      transform: scale(0.93);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.9), inset 0 5px 15px rgba(0, 0, 0, 0.8);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .key-btn.pressed {
      background: radial-gradient(circle at 30% 30%, #4a4a6a, #1e1e30);
      border-color: #ffd966;
      box-shadow: 0 0 30px rgba(255, 220, 100, 0.6), 0 5px 15px rgba(0,0,0,0.8);
      color: #fff;
      transform: scale(0.95);
    }

    .key-btn .key-label {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 2px 5px black;
    }

    .key-btn .key-hint {
      font-size: 0.75rem;
      margin-top: 5px;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    /* 当前偏差展示 */
    .current-diff {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 30px;
      padding: 15px 25px;
      text-align: center;
      min-width: 200px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .diff-value {
      font-size: 3.5rem;
      font-weight: 700;
      transition: color 0.15s;
    }

    .diff-label {
      font-size: 0.9rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .grade-text {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    /* 统计面板 */
    .stats-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-top: 5px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 12px 5px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #7a7a8c;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .avg-diff {
      grid-column: span 2;
      background: rgba(255, 255, 255, 0.05);
    }

    /* 最近偏差条 */
    .history-title {
      align-self: flex-start;
      color: #aaa;
      font-size: 0.8rem;
      letter-spacing: 1px;
      margin-bottom: -10px;
    }

    .diff-bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 80px;
      width: 100%;
      justify-content: center;
    }

    .bar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      max-width: 50px;
    }

    .bar {
      width: 100%;
      background: #555;
      border-radius: 8px 8px 0 0;
      min-height: 5px;
      transition: height 0.2s, background 0.2s;
      box-shadow: 0 0 10px currentColor;
    }

    .bar-time {
      font-size: 0.55rem;
      color: #888;
    }

    .empty-history {
      color: #555;
      font-size: 0.8rem;
      align-self: center;
    }

    /* 控制区 */
    .controls {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      font-size: 0.9rem;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }

    select {
      background: rgba(20, 20, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      padding: 10px 15px;
      border-radius: 30px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-size: 0.9rem;
    }

    .warning-message {
      color: #ff7b7b;
      font-size: 0.85rem;
      min-height: 20px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 450px) {
      .key-btn {
        width: 100px;
        height: 100px;
      }
      .key-btn .key-label {
        font-size: 2rem;
      }
      .diff-value {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>φ 双押整齐度</h1>
    <div class="subtitle">连续双押检测 · 键盘 D / K 或点击按钮</div>

    <!-- 双押按钮 -->
    <div class="dual-zone">
      <div class="key-btn" id="leftBtn">
        <span class="key-label">D</span>
        <span class="key-hint">左手</span>
      </div>
      <div class="key-btn" id="rightBtn">
        <span class="key-label">K</span>
        <span class="key-hint">右手</span>
      </div>
    </div>

    <!-- 当前判定 -->
    <div class="current-diff">
      <div class="diff-label">当前偏差</div>
      <div class="diff-value" id="diffDisplay">-- ms</div>
      <div class="grade-text" id="gradeDisplay"></div>
    </div>
    <div class="warning-message" id="warning"></div>

    <!-- 统计 -->
    <div class="stats-panel">
      <div class="stat-item">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">总次数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value perfect-color" id="perfectCount">0</div>
        <div class="stat-label">完美</div>
      </div>
      <div class="stat-item">
        <div class="stat-value good-color" id="goodCount">0</div>
        <div class="stat-label">良好</div>
      </div>
      <div class="stat-item">
        <div class="stat-value ok-color" id="okCount">0</div>
        <div class="stat-label">一般</div>
      </div>
      <div class="stat-item">
        <div class="stat-value bad-color" id="badCount">0</div>
        <div class="stat-label">差</div>
      </div>
      <div class="stat-item avg-diff">
        <div class="stat-value" id="avgDiff">0 ms</div>
        <div class="stat-label">平均偏差</div>
      </div>
    </div>

    <!-- 最近偏差条 -->
    <div class="history-title">最近双押偏差</div>
    <div class="diff-bars" id="diffBars">
      <div class="empty-history">等待双押…</div>
    </div>

    <!-- 控制 -->
    <div class="controls">
      <select id="strictness">
        <option value="easy">宽松判定</option>
        <option value="normal" selected>标准判定</option>
        <option value="hard">严格判定</option>
      </select>
      <button id="resetBtn">↺ 重置统计</button>
    </div>
  </div>

  <script>
    (function() {
      // ----- 判定阈值配置 -----
      const strictnessMap = {
        easy: { perfect: 50, good: 100, ok: 150, window: 200 },
        normal: { perfect: 30, good: 60, ok: 100, window: 150 },
        hard: { perfect: 15, good: 35, ok: 60, window: 120 }
      };

      let currentConfig = strictnessMap.normal;

      // ----- 状态变量 -----
      let leftPressed = false;
      let rightPressed = false;
      let leftTime = 0;
      let rightTime = 0;
      let dualRecorded = false;   // 当前这组按下是否已记录双押

      // 统计
      let stats = {
        total: 0,
        perfect: 0,
        good: 0,
        ok: 0,
        bad: 0,
        totalDiff: 0,
        recentDiffs: []   // 最多保存5个，最新的在前
      };

      // ----- DOM 元素 -----
      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');
      const diffDisplay = document.getElementById('diffDisplay');
      const gradeDisplay = document.getElementById('gradeDisplay');
      const warningEl = document.getElementById('warning');
      const totalCountEl = document.getElementById('totalCount');
      const perfectCountEl = document.getElementById('perfectCount');
      const goodCountEl = document.getElementById('goodCount');
      const okCountEl = document.getElementById('okCount');
      const badCountEl = document.getElementById('badCount');
      const avgDiffEl = document.getElementById('avgDiff');
      const diffBarsEl = document.getElementById('diffBars');
      const strictnessSelect = document.getElementById('strictness');
      const resetBtn = document.getElementById('resetBtn');

      // ----- 辅助函数 -----
      function getGrade(diff) {
        if (diff <= currentConfig.perfect) return 'perfect';
        if (diff <= currentConfig.good) return 'good';
        if (diff <= currentConfig.ok) return 'ok';
        return 'bad';
      }

      function getGradeText(grade) {
        const map = {
          perfect: '✨ 完美 ✨',
          good: '👍 良好',
          ok: '👌 一般',
          bad: '💦 差'
        };
        return map[grade] || '';
      }

      function getGradeColor(grade) {
        const map = {
          perfect: '#ffd966',
          good: '#4a90e2',
          ok: '#7ed321',
          bad: '#9b9b9b'
        };
        return map[grade] || '#fff';
      }

      // 更新界面
      function updateUI(lastDiff = null, lastGrade = null) {
        // 当前偏差显示
        if (lastDiff !== null && lastGrade !== null) {
          diffDisplay.textContent = `${lastDiff} ms`;
          diffDisplay.style.color = getGradeColor(lastGrade);
          gradeDisplay.textContent = getGradeText(lastGrade);
          gradeDisplay.style.color = getGradeColor(lastGrade);
        } else {
          diffDisplay.textContent = '-- ms';
          diffDisplay.style.color = '#aaa';
          gradeDisplay.textContent = '';
        }

        // 统计数字
        totalCountEl.textContent = stats.total;
        perfectCountEl.textContent = stats.perfect;
        goodCountEl.textContent = stats.good;
        okCountEl.textContent = stats.ok;
        badCountEl.textContent = stats.bad;
        const avg = stats.total > 0 ? (stats.totalDiff / stats.total).toFixed(1) : 0;
        avgDiffEl.textContent = `${avg} ms`;

        // 最近偏差条
        renderDiffBars();
      }

      function renderDiffBars() {
        diffBarsEl.innerHTML = '';
        if (stats.recentDiffs.length === 0) {
          diffBarsEl.innerHTML = '<div class="empty-history">等待双押…</div>';
          return;
        }

        // 最大偏差用于比例（但不超过有效窗口）
        const maxWindow = currentConfig.window;
        stats.recentDiffs.forEach(diff => {
          const grade = getGrade(diff);
          const heightPercent = Math.min(100, (diff / maxWindow) * 100);
          const color = getGradeColor(grade);

          const wrapper = document.createElement('div');
          wrapper.className = 'bar-wrapper';

          const bar = document.createElement('div');
          bar.className = 'bar';
          bar.style.height = `${Math.max(6, heightPercent)}%`;
          bar.style.backgroundColor = color;
          bar.style.boxShadow = `0 0 12px ${color}`;

          const timeLabel = document.createElement('span');
          timeLabel.className = 'bar-time';
          timeLabel.textContent = `${diff}ms`;

          wrapper.appendChild(bar);
          wrapper.appendChild(timeLabel);
          diffBarsEl.appendChild(wrapper);
        });
      }

      // 处理有效双押
      function processDual(diff) {
        const grade = getGrade(diff);
        stats.total++;
        stats.totalDiff += diff;
        stats.recentDiffs.unshift(diff);
        if (stats.recentDiffs.length > 5) stats.recentDiffs.pop();

        switch (grade) {
          case 'perfect': stats.perfect++; break;
          case 'good': stats.good++; break;
          case 'ok': stats.ok++; break;
          case 'bad': stats.bad++; break;
        }

        updateUI(diff, grade);
        warningEl.textContent = '';

        // 按钮动画反馈
        leftBtn.classList.add('pressed');
        rightBtn.classList.add('pressed');
        setTimeout(() => {
          if (!leftPressed) leftBtn.classList.remove('pressed');
          if (!rightPressed) rightBtn.classList.remove('pressed');
        }, 150);
      }

      // 检查是否形成双押
      function checkDual() {
        if (leftPressed && rightPressed && !dualRecorded && leftTime > 0 && rightTime > 0) {
          const diff = Math.abs(leftTime - rightTime);
          if (diff <= currentConfig.window) {
            processDual(diff);
            dualRecorded = true;
          } else {
            // 超出有效窗口，提示不同步
            warningEl.textContent = `⚠️ 偏差过大 (${diff.toFixed(0)}ms)，请同时按下`;
            // 仍然记录为已触发，避免反复提示，等待抬起重置
            dualRecorded = true;
          }
        }
      }

      // 通用按下处理
      function handlePress(side) {
        const now = performance.now();
        if (side === 'left') {
          if (leftPressed) return; // 已经按下，忽略重复（包括键盘repeat）
          leftPressed = true;
          leftTime = now;
          leftBtn.classList.add('pressed');
        } else if (side === 'right') {
          if (rightPressed) return;
          rightPressed = true;
          rightTime = now;
          rightBtn.classList.add('pressed');
        }
        checkDual();
      }

      // 通用释放处理
      function handleRelease(side) {
        if (side === 'left') {
          leftPressed = false;
          leftTime = 0;
          leftBtn.classList.remove('pressed');
        } else if (side === 'right') {
          rightPressed = false;
          rightTime = 0;
          rightBtn.classList.remove('pressed');
        }

        // 两个键都松开，重置记录状态，准备下一次双押
        if (!leftPressed && !rightPressed) {
          dualRecorded = false;
          warningEl.textContent = '';
        }
      }

      // ----- 事件绑定 -----
      // 键盘事件
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        const key = e.key.toLowerCase();
        if (key === 'd') {
          e.preventDefault();
          handlePress('left');
        } else if (key === 'k') {
          e.preventDefault();
          handlePress('right');
        }
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'd') {
          e.preventDefault();
          handleRelease('left');
        } else if (key === 'k') {
          e.preventDefault();
          handleRelease('right');
        }
      });

      // 触摸/鼠标事件（按钮）
      function bindButtonEvents(btnElement, side) {
        // 鼠标
        btnElement.addEventListener('mousedown', (e) => {
          e.preventDefault();
          handlePress(side);
        });
        btnElement.addEventListener('mouseup', (e) => {
          e.preventDefault();
          handleRelease(side);
        });
        btnElement.addEventListener('mouseleave', (e) => {
          // 如果鼠标离开按钮时仍处于按下状态，释放
          if ((side === 'left' && leftPressed) || (side === 'right' && rightPressed)) {
            handleRelease(side);
          }
        });

        // 触摸
        btnElement.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handlePress(side);
        }, { passive: false });
        btnElement.addEventListener('touchend', (e) => {
          e.preventDefault();
          handleRelease(side);
        });
        btnElement.addEventListener('touchcancel', (e) => {
          e.preventDefault();
          handleRelease(side);
        });
      }

      bindButtonEvents(leftBtn, 'left');
      bindButtonEvents(rightBtn, 'right');

      // 全局防止误触导致页面缩放等
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('gesturechange', (e) => e.preventDefault());
      document.addEventListener('gestureend', (e) => e.preventDefault());

      // 严格度切换
      strictnessSelect.addEventListener('change', (e) => {
        currentConfig = strictnessMap[e.target.value] || strictnessMap.normal;
        // 不清空统计，但提示
        warningEl.textContent = '判定阈值已更新';
        setTimeout(() => { if (warningEl.textContent === '判定阈值已更新') warningEl.textContent = ''; }, 2000);
      });

      // 重置按钮
      resetBtn.addEventListener('click', () => {
        stats = {
          total: 0,
          perfect: 0,
          good: 0,
          ok: 0,
          bad: 0,
          totalDiff: 0,
          recentDiffs: []
        };
        leftPressed = false;
        rightPressed = false;
        leftTime = 0;
        rightTime = 0;
        dualRecorded = false;
        leftBtn.classList.remove('pressed');
        rightBtn.classList.remove('pressed');
        updateUI(null, null);
        warningEl.textContent = '';
      });

      // 初始UI
      updateUI(null, null);

      // 页面失去焦点时重置按键状态（防止卡键）
      window.addEventListener('blur', () => {
        if (leftPressed || rightPressed) {
          leftPressed = false;
          rightPressed = false;
          leftTime = 0;
          rightTime = 0;
          dualRecorded = false;
          leftBtn.classList.remove('pressed');
          rightBtn.classList.remove('pressed');
          warningEl.textContent = '';
        }
      });

    })();
  </script>
</body>
</html>
